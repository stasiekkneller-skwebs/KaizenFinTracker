{% extends "base.html" %}

{% block title %}Usuń kategorię{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card border-0 shadow-sm p-4" style="max-width: 500px; margin: 0 auto;">
        <h5 class="mb-3">Usuń kategorię</h5>
        <p>Czy na pewno chcesz usunąć kategorię 
            <strong style="color: #c8481a;">{{ object.name }}</strong>?
        </p>
        <small class="text-muted mb-4 d-block">
            Tej operacji nie można cofnąć. Transakcje przypisane do tej kategorii zostaną bez kategorii.
        </small>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger btn-sm">Usuń</button>
                <a href="{% url 'all-categories' %}" class="btn btn-outline-secondary btn-sm">Anuluj</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
