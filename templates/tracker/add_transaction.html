{% extends "base.html" %}

{% block title %}Dodaj transakcję{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border p-4 card-auth">
                <h3 class="mb-4 fw-normal">Dodaj wydatek</h3>
                <form method="post" enctype="multipart/form-data" class="app-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary mt-3">Dodaj transackę</button>
    </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
