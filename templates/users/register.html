{% extends "base.html" %}

{% block title %}Rejestracja{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border p-4 card-auth">
                <h3 class="mb-4 fw-normal">Rejestracja</h3>
                <form method="post" class="form-auth">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-outline-dark w-100 mt-2">Zarejestruj się</button>
                </form>

                <p class="mt-3 mb-0">
                    Masz już konto? <a href="{% url 'login' %}">Zaloguj się</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
